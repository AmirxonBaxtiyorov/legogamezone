<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Game Zone Qarz API</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 28px; margin-bottom: 12px; }
    p { opacity: 0.9; line-height: 1.6; margin-bottom: 8px; font-size: 14px; }
    code {
      background: rgba(0, 0, 0, 0.25);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .ok {
      display: inline-block;
      margin-top: 16px;
      padding: 6px 14px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.4);
      border-radius: 999px;
      font-size: 13px;
    }
    a { color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 48px; margin-bottom: 16px;">🎮</div>
    <h1>Game Zone Qarz API</h1>
    <p>Backend xizmati ishlamoqda.</p>
    <p>Foydalanuvchi interfeysi: <a href="https://www.legogamezone.uz">legogamezone.uz</a></p>
    <p>Health check: <code>/api/health</code></p>
    <div class="ok">✅ Online</div>
  </div>
</body>
</html>
