# Railway-specific nginx config — backend bilan to'g'ridan to'g'ri so'rov,
# proxy yo'q (frontend va backend alohida domenlarda).

server {
  listen $PORT;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Asosiy SPA — barcha route'lar index.html'ga
  location / {
    try_files $uri /index.html;
  }

  # Static asset cache
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
  }

  # Healthcheck (Railway uchun)
  location /health {
    access_log off;
    return 200 'ok';
    add_header Content-Type text/plain;
  }
}
