# ============================================================
# Game Zone Qarz — docker-compose (dev / prod)
# ============================================================
# Ishga tushirish:
#   docker compose up -d
#
# Production'dan oldin .env'ni to'ldiring (ayniqsa JWT_SECRET, parollar)
# ============================================================
version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: gz_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-gamezone}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-gamezone}
      TZ: Asia/Tashkent
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-gamezone}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gz_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      TZ: Asia/Tashkent
      LOG_LEVEL: info
      DATABASE_URL: postgresql://${DB_USER:-gamezone}:${DB_PASSWORD:-changeme}@postgres:5432/${DB_NAME:-gamezone}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET majburiy va kamida 64 belgi}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      JWT_EXPIRES_IN_REMEMBER: ${JWT_EXPIRES_IN_REMEMBER:-30d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OWNER_ID: ${TELEGRAM_OWNER_ID:-}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-5}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-100}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: gz_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:8080"

volumes:
  pg_data:
