# Railway Nixpacks uchun build sozlamasi.
# Eslatma: railway.json builder=DOCKERFILE bo'lsa, bu fayl ishlatilmaydi.
# Lekin agar Railpack/Nixpacks fallback bo'lsa, build buzilmasin.

[phases.setup]
nixPkgs = ["nodejs_20", "openssl"]

[phases.install]
cmds = [
  "npm install --workspace=backend --include-workspace-root --no-audit --no-fund"
]

[phases.build]
cmds = [
  "cd backend && npx prisma generate",
  "npm run build --workspace=backend"
]

[start]
cmd = "npm run start --workspace=backend"
